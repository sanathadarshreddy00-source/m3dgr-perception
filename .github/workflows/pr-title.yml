# A squash merge uses the PR title as the commit message on main, and no local
# hook sees it. Check the title with the same hook as local commit messages.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.10.5"
          enable-cache: true
      - name: Check title
        env:
          # Passed through env, never pasted into the script: a title is
          # untrusted text and could otherwise inject shell commands.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title.txt"
          uv run pre-commit run conventional-pre-commit --hook-stage commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/title.txt"
