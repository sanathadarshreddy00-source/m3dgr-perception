[project]
name = "m3dgr-perception"
version = "0.0.0"
description = "Multi-sensor trajectory estimation and 3D reconstruction on M3DGR Outdoor01"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Reads ROS 1 / ROS 2 bags in pure Python, without a ROS install.
    "rosbags>=0.10",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Import name differs from the distribution name.
module-name = "m3dgr"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Code blocks in docs are hand-aligned for reading; leave them alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: style errors and warnings
    "F",       # pyflakes: unused names, undefined names
    "I",       # import sorting
    "N",       # naming
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax for the target Python
    "SIM",     # simplifications
    "RUF",     # ruff's own checks
    "BLE",     # blind `except Exception` (conventions rule 11)
    "T20",     # print instead of logging (conventions rule 16)
]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
# Imports ROS 2 (rclpy, rosbag2_py), which exists only in the ROS container.
exclude = ['scripts/ros2_dump_messages.py']
strict = true
