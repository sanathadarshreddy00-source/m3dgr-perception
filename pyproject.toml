[project]
name = "m3dgr-perception"
version = "0.0.0"
description = "Multi-sensor trajectory estimation and 3D reconstruction on M3DGR Outdoor01"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Reads ROS 1 / ROS 2 bags in pure Python, without a ROS install.
    "rosbags>=0.10",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Import name differs from the distribution name.
module-name = "m3dgr"
